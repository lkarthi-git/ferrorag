[package]
name = "ferro-rag"
version = "0.1.0"
edition = "2024"

[features]
token-greedy-chunker = ["dep:tokenizers"]
structural-chunker = ["dep:tokenizers"]
pdf-inspector = ["dep:pdf-inspector"]
lance-db = ["dep:lancedb"]
local-embeddings = ["dep:fastembed", "dep:ort"]

[dependencies]
ferro-core = { path = "../core" }
async-trait.workspace = true
futures = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = "1.28.0"
bytes = "1.12.1"
thiserror = "2.0.21"
sha2 = "0.11.1"
lancedb = { version = "0.39.0", features = ["remote"], optional = true }
tokenizers = {version = "0.23.2", features = ["http"], optional = true }
pdf-inspector = {version = "1.25.2", optional = true }
ort = { version = "2.0.0-rc.13", features = ["lax-feature-matching"],optional = true }
fastembed = {version = "7.1.1", optional = true }

# macOS-specific overrides: Use the correct compile feature 'coreml'
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = [] , optional = true}

# Linux / Windows specific overrides: Use 'cuda
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["cuda"] , optional = true}

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["cuda"], optional = true }
