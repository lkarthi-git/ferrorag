[package]
name = "ferro-rag"
version = "0.1.0"
edition = "2024"

[features]
token-greedy-chunker = ["dep:tokenizers"]
structural-chunker = ["dep:tokenizers"]
pdf-inspector = ["dep:pdf-inspector"]
lance-db = ["dep:lancedb"]
candle = ["dep:candle-core","dep:candle-nn","dep:hf-hub","dep:tokenizers","dep:candle-transformers","dep:gliner25-rs"]
cuda = ["candle-core?/cuda", "candle-nn?/cuda","candle-transformers?/cuda","candle-transformers?/flash-attn","ort?/cuda",]
metal = ["candle-core?/metal", "candle-nn?/metal","ort?/coreml",]
ort = ["dep:ort","dep:hf-hub","dep:tokenizers","dep:gliner25-rs"]

[dependencies]
ferro-core = { path = "../core" }
async-trait.workspace = true
futures = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = "1.28.0"
bytes = "1.12.1"
thiserror = "2.0.21"
sha2 = "0.11.1"
lancedb = { version = "0.39.0", features = ["remote"], optional = true }
tokenizers = {version = "0.23.2", features = ["http"], optional = true }
pdf-inspector = {version = "1.25.2", optional = true }
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = {version = "0.11.0", optional = true }
hf-hub = {version = "1.0.0",features = ["blocking"], optional = true }
gliner25-rs = { version ="0.5.6", features=["hub"], optional =true}
ort = { version = "2.0.0-rc.13", optional = true } 
