[workspace]
resolver = "2" # Required for modern Rust workspaces
members = [
    "crates/core-engine", "crates/rag-pipeline",
]

# OPTIONAL BUT HIGHLY RECOMMENDED: Workspace Dependencies
# Define shared dependencies here so all crates use the exact same versions
[workspace.dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
metrics = "0.24.6"
rand = "0.10.2"
rayon = "1.12.0"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
